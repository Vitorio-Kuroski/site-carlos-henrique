<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="only light">
    <meta name="robots" content="noindex">
    <title>Mensagens | Carlos Henrique</title>
    <meta name="theme-color" content="#0F3D2E">
    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="conta-pagina">
    <header class="topo">
        <div class="caixa topo__linha">
            <a href="../../" class="marca">Carlos Henrique<span>Accountant · Dublin</span></a>
            <a href="../" class="link-seta">Área do aluno</a>
        </div>
    </header>

    <main class="caixa conta">
        <div class="conta__cartao conta__cartao--largo chat">
            <p class="rotulo"><span class="rotulo__linha"></span>Mensagens</p>
            <h1>Fale com <em>o Carlos</em></h1>
            <p class="nota">Tire dúvidas sobre os cursos e as aulas. A resposta aparece aqui, e você recebe um aviso por e-mail.</p>
            <div class="chat__lista" id="conversa" aria-live="polite">
                <p class="chat__vazio">Carregando…</p>
            </div>
            <form class="chat__form" id="form-mensagem" novalidate>
                <label class="sr-only" for="texto">Sua mensagem</label>
                <textarea id="texto" name="texto" rows="3" maxlength="4000" placeholder="Escreva sua mensagem…" required></textarea>
                <p class="conta__erro" id="erro" role="alert" hidden></p>
                <button type="submit" class="botao">Enviar</button>
            </form>
        </div>
    </main>

    <script src="../conta.js"></script>
    <script>paginaMensagens();</script>
</body>
</html>
