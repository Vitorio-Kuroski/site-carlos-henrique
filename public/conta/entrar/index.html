<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="only light">
    <meta name="robots" content="noindex">
    <title>Entrar | Carlos Henrique</title>
    <meta name="theme-color" content="#0F3D2E">
    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="conta-pagina">
    <header class="topo">
        <div class="caixa topo__linha">
            <a href="../../" class="marca">Carlos Henrique<span>Accountant · Dublin</span></a>
            <a href="../../blog/" class="link-seta">Blog</a>
        </div>
    </header>

    <main class="caixa conta">
        <div class="conta__cartao">
            <p class="rotulo"><span class="rotulo__linha"></span>Área do aluno</p>
            <h1>Entrar</h1>
            <form id="form" class="conta__form" novalidate>
                <label class="campo">E-mail
                    <input name="email" type="email" autocomplete="email" required maxlength="200">
                </label>
                <label class="campo">Senha
                    <input name="senha" type="password" autocomplete="current-password" required maxlength="200">
                </label>
                <p class="conta__erro" id="erro" role="alert" hidden></p>
                <button type="submit" class="botao">Entrar</button>
            </form>
            <p class="conta__troca">Ainda não tem conta? <a href="../cadastro/">Criar conta</a></p>
        </div>
    </main>

    <script src="../../conta/conta.js"></script>
    <script>formularioConta("/api/conta/entrar");</script>
</body>
</html>
