<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="only light">
    <meta name="robots" content="noindex">
    <!-- O link tem o código da senha nova: não repassar o endereço para outros sites -->
    <meta name="referrer" content="no-referrer">
    <title>Criar senha nova | Carlos Henrique</title>
    <meta name="theme-color" content="#0F3D2E">
    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="conta-pagina">
    <header class="topo">
        <div class="caixa topo__linha">
            <a href="../../" class="marca">Carlos Henrique<span>Accountant · Dublin</span></a>
            <a href="../../blog/" class="link-seta">Blog</a>
        </div>
    </header>

    <main class="caixa conta">
        <div class="conta__cartao">
            <p class="rotulo"><span class="rotulo__linha"></span>Área do aluno</p>
            <h1>Criar senha nova</h1>
            <form id="form" class="conta__form" novalidate>
                <label class="campo">Senha nova (mínimo de 8 caracteres)
                    <input name="senha" type="password" autocomplete="new-password" required minlength="8" maxlength="200">
                </label>
                <label class="campo">Repita a senha nova
                    <input name="confirmar" type="password" autocomplete="new-password" required minlength="8" maxlength="200">
                </label>
                <p class="conta__erro" id="erro" role="alert" hidden></p>
                <button type="submit" class="botao">Salvar a senha nova</button>
            </form>
            <p class="conta__troca"><a href="../esqueci/">Pedir um link novo</a></p>
        </div>
    </main>

    <script src="../../conta/conta.js"></script>
    <script>formularioNovaSenha();</script>
</body>
</html>
