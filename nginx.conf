server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # CSS e JS (e o HTML acima) sempre conferidos com o servidor: edições aparecem ao recarregar
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
